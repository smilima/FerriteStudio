[workspace]
resolver = "2"
members = [
    "app",
    "crates/ferrite-form",
    "crates/ferrite-build",
    "crates/ferrite-rpc",
    "crates/ferrite-lsp",
    "crates/ferrite-dap",
]
default-members = ["app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[workspace.dependencies]
ferrite-form = { path = "crates/ferrite-form" }
ferrite-build = { path = "crates/ferrite-build" }
ferrite-rpc = { path = "crates/ferrite-rpc" }
ferrite-lsp = { path = "crates/ferrite-lsp" }
ferrite-dap = { path = "crates/ferrite-dap" }

slint = "1.18"
slint-build = "1.18"
slint-interpreter = "1.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
anyhow = "1"
lsp-types = "0.97"
cargo_metadata = "0.23"
rfd = "0.17"
dirs = "7"

[profile.dev.package."*"]
# Dependencies (Slint in particular) build with optimisations so the IDE
# stays responsive in debug builds; our own crates keep fast compiles.
opt-level = 2
